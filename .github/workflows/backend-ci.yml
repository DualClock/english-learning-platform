name: Backend CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths:
      - 'EnglishLearningPlatform.API/**'
      - 'EnglishLearningPlatform.API.Tests/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'EnglishLearningPlatform.API/**'
      - 'EnglishLearningPlatform.API.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass123
          POSTGRES_DB: english_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EnglishLearningPlatform.API/EnglishLearningPlatform.API.csproj

      - name: Build
        run: dotnet build EnglishLearningPlatform.API/EnglishLearningPlatform.API.csproj --no-restore --configuration Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=english_learning_test;Username=appuser;Password=apppass123"
          Jwt__Key: "test-secret-key-for-ci-min-32-chars!!"
          Jwt__Issuer: "TestIssuer"
          Jwt__Audience: "TestAudience"
        # --no-build убирался не за компанию: он собирал только API-проект, тестовая
        # сборка при этом не существовала, и шаг Test падал (или «проходил» пусто).
        # dotnet test сам восстановит и соберёт тестовый проект.
        run: |
          if [ -d "EnglishLearningPlatform.API.Tests" ]; then
            dotnet test EnglishLearningPlatform.API.Tests/EnglishLearningPlatform.API.Tests.csproj --verbosity normal
          else
            echo "No test project found, skipping tests"
            exit 1
          fi

      # Non-blocking по той же причине, что и во фронтенде: ImageSharp 3.1.12 несёт
      # известные high-адвизори, принятые с датой пересмотра (R-xx в
      # security/risk-register.md), потому что фикс — платная 4.x. Блокирующим шаг
      # станет после смены декодера или покупки лицензии.
      - name: Vulnerable packages (non-blocking until accepted risks close)
        continue-on-error: true
        run: dotnet list EnglishLearningPlatform.API/EnglishLearningPlatform.API.csproj package --vulnerable --include-transitive

      # Проверки «модель разошлась с миграциями» здесь намеренно нет:
      # `dotnet ef migrations has-model-changes` удалён из EF Core 7+, а
      # `migrations list` требует живого подключения к базе. Применение миграций
      # остаётся ручным шагом деплоя под номером 1 в EXECUTION_SEQUENCE A9 —
      # новый код без них ломает регистрацию, и это проверяется на стенде, а не в CI.