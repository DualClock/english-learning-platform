name: Secret Scan

# Gitleaks по пул-реквестам: не дать секретам (JWT-ключи, Gemini/прокси-креденты,
# .env) попасть в дерево или историю репозитория. Только проверка — без деплоя.
# Основание: SECURITY_GATE 1.2, раздел «секреты могут попасть в образ».

on:
  # push тоже сканируется, а не только pull_request: в этот проект коммитят
  # прямо в release/beta (PR-процесса нет), то есть PR-only фильтр означал, что
  # НИ ОДИН реальный пуш не проверялся на секреты — именно так ключи из
  # appsettings.Development.json могли уехать в публичный репозиторий.
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # gitleaks сканирует и историю коммитов — нужен весь graph
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Проверка ЗАГЛУШЕК перед выкаткой: gitleaks ищет настоящие секреты в истории,
  # а этот шаг отвечает на другой вопрос — «остался ли в дереве плейсхолдер из
  # туториала, который выглядит как рабочий ключ». Именно так на сервер уехал
  # NEXTAUTH_SECRET, известный всем, кто читал документацию next-auth.
  # --strict обязателен: без него скрипт предупреждает (exit 0), а в CI нужно падать.
  placeholders:
    name: Placeholder secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject placeholder secrets
        run: bash scripts/check-secrets.sh --strict
