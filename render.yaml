services:
  - type: web
    name: lexicon-api
    runtime: docker
    dockerfilePath: ./EnglishLearningPlatform.API/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__Origins
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: EnglishLearningPlatform
      - key: Jwt__Audience
        value: EnglishLearningPlatform.Users
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__ProxyUrl
        value: ""
      - key: Gemini__Model
        value: gemini-2.5-flash
      - key: Seeder__Key
        sync: false
      # Куда присылать отзывы беты. Если пусто — на Email__From.
      - key: Feedback__ToEmail
        sync: false
