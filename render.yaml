services:
  - type: web
    name: lexicon-api
    runtime: docker
    dockerfilePath: ./EnglishLearningPlatform.API/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__Origins
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: EnglishLearningPlatform
      - key: Jwt__Audience
        value: EnglishLearningPlatform.Users
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__ProxyUrl
        value: ""
      - key: Gemini__Model
        value: gemini-2.5-flash
      - key: Seeder__Key
        sync: false
      # Сети реверс-прокси, чьему X-Forwarded-For мы верим (CIDR через запятую).
      # Без них все лимиты партицируются по адресу прокси: один клиент,
      # исчерпавший лимит, блокирует всю бету. Значения — в DEPLOY.md.
      - key: Proxy__TrustedCidrs
        sync: false
      # Соль для хеша IP в гостевой воронке /test (W2.4). Пусто = случайный ключ
      # процесса: хеши по-прежнему необратимы, но «уникальные гости за сутки»
      # перестают сходиться между рестартами.
      - key: Analytics__GuestIpSalt
        sync: false
      # Сколько суток хранить гостевые события воронки /test (W4.1). Пусто = 30:
      # фоновая чистка удаляет строки старше порога батчами, суточный IpHash не
      # имеет смысла дольше нескольких дней. 0 и мусор в значении не отключают
      # очистку — берётся 30 (см. DEPLOY.md).
      - key: Analytics__GuestRetentionDays
        sync: false
      # Суточный кап новых регистраций на весь сервис (по умолчанию 500).
      - key: Registration__DailyGlobalLimit
        sync: false
      # Общий дневной бюджет обращений к Gemini на весь сервис (по умолчанию 2000).
      - key: Ai__GlobalDailyRequestLimit
        sync: false
      # Сколько AI-вызовов подряд разрешено одному аккаунту за минуту
      # (по умолчанию 30) — тормозит burst, который успевает дойти до
      # провайдера между обновлениями дневного счётчика.
      - key: Ai__PerMinuteUserRequestLimit
        sync: false
      # Куда присылать отзывы беты. Если пусто — на Email__From.
      - key: Feedback__ToEmail
        sync: false
